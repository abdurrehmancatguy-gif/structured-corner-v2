<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGS Corner admin</title>
<style>
  :root{
    --ink:#16181D; --body:#3A3F49; --mut:#616874; --faint:#8A909C;
    --bg:#FBFBFC; --alt:#F2F3F5; --hair:#E3E5E9; --line:#D3D7DE;
    --accent:#B02A37; --green:#1E6B4E; --r:4px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.5;
    color:var(--body);background:var(--bg)}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;
    padding:0 20px;height:60px;background:var(--bg);border-bottom:1px solid var(--hair)}
  header b{color:var(--ink);font-size:15px;letter-spacing:-.01em}
  header .sp{flex:1}
  .layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}
  nav{border-right:1px solid var(--hair);padding:16px 0;background:var(--alt)}
  nav button{display:block;width:100%;text-align:left;padding:10px 20px;border:0;
    background:none;font-family:inherit;font-size:13.5px;color:var(--body);cursor:pointer}
  nav button:hover{color:var(--ink);background:#fff}
  nav button.on{color:var(--ink);font-weight:600;background:#fff;
    box-shadow:inset 3px 0 0 var(--ink)}
  main{padding:24px 28px 80px;max-width:900px}
  h1{font-size:20px;color:var(--ink);margin:0 0 4px;letter-spacing:-.02em}
  .hint{color:var(--mut);font-size:12.5px;margin:0 0 20px}

  .btn{font-family:inherit;font-size:13px;font-weight:600;border-radius:var(--r);
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:0 14px;min-height:38px;cursor:pointer}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#000}
  .btn.danger{color:var(--accent);border-color:var(--line)}
  .btn.danger:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  label.f{display:block;margin-bottom:14px}
  label.f > span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.03em;
    text-transform:uppercase;color:var(--mut);margin-bottom:5px}
  input[type=text],input[type=number],textarea,select{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;min-height:40px}
  textarea{min-height:76px;resize:vertical;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);
    outline-offset:1px;border-color:var(--ink)}
  label.bool{display:flex;align-items:center;gap:8px;margin-bottom:14px;
    font-size:13.5px;color:var(--ink)}
  label.bool input{width:16px;height:16px;min-height:0}

  fieldset{border:1px solid var(--hair);border-radius:var(--r);padding:14px 16px;
    margin:0 0 16px;background:#fff}
  legend{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    color:var(--mut);padding:0 6px}
  .item{border:1px solid var(--hair);border-radius:var(--r);padding:12px 14px;
    margin-bottom:10px;background:var(--alt)}
  .item > .row:first-child{margin-bottom:8px}
  .idx{font-family:var(--mono);font-size:11px;color:var(--faint)}

  .list{display:grid;gap:6px;margin-bottom:20px}
  .list a{display:flex;justify-content:space-between;gap:10px;align-items:center;
    padding:10px 12px;border:1px solid var(--hair);border-radius:var(--r);
    background:#fff;color:var(--ink);text-decoration:none;font-size:13.5px;cursor:pointer}
  .list a:hover{border-color:var(--ink)}
  .list .meta{color:var(--mut);font-size:12px;font-family:var(--mono)}
  .tag{font-size:11px;font-family:var(--mono);color:var(--mut);
    border:1px solid var(--hair);border-radius:99px;padding:2px 8px}
  .tag.off{color:var(--accent);border-color:var(--accent)}

  .savebar{position:fixed;left:230px;right:0;bottom:0;display:flex;align-items:center;
    gap:12px;padding:12px 28px;background:rgba(251,251,252,.97);
    border-top:1px solid var(--hair);backdrop-filter:blur(8px)}
  .status{font-size:12.5px;color:var(--mut)}
  .status.ok{color:var(--green)}
  .status.err{color:var(--accent)}
  .search{margin-bottom:14px}
  .imgstrip{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
  .imgcard{width:104px;border:1px solid var(--hair);border-radius:var(--r);
    background:#fff;padding:6px;text-align:center}
  .imgcard img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:2px;display:block}
  .imgcard .nm{font-size:10px;font-family:var(--mono);color:var(--mut);
    margin:5px 0 6px;word-break:break-all;line-height:1.3}
  .imgcard .row{gap:4px;justify-content:center}
  .imgcard button{font-size:11px;min-height:26px;padding:0 7px}
  .imgcard.primary{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .imgcard.primary .nm{color:var(--ink);font-weight:600}
  .bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:10px 12px;border:1px solid var(--hair);border-radius:var(--r);
    background:#fff;margin-bottom:12px}
  .bulk .n{font-size:12.5px;color:var(--mut)}
  .list a input{width:16px;height:16px;margin-right:4px}
  .panel{position:fixed;right:0;top:60px;bottom:0;width:380px;background:#fff;
    border-left:1px solid var(--hair);padding:18px 20px;overflow:auto;z-index:20;
    box-shadow:-8px 0 28px rgba(22,24,29,.08)}
  .panel h2{font-size:15px;color:var(--ink);margin:0 0 4px}
  .panel .v{display:flex;justify-content:space-between;gap:8px;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
  .panel .v code{font-family:var(--mono);font-size:11px;color:var(--mut)}
  .group{margin:0 0 18px;border:1px solid var(--hair);border-radius:var(--r);background:#fff}
  .group > summary{cursor:pointer;padding:11px 14px;font-size:12px;font-weight:600;
    letter-spacing:.03em;text-transform:uppercase;color:var(--mut)}
  .group[open] > summary{border-bottom:1px solid var(--hair);color:var(--ink)}
  .group .inner{padding:14px 16px 4px}
</style>
</head><body>

<header>
  <b>BGS Corner admin</b>
  <span class="tag">local only</span>
  <span class="sp"></span>
  <a class="btn" href="http://localhost:4310" target="_blank" rel="noopener">Open storefront</a>
  <button class="btn" id="history">History</button>
  <a class="btn" href="/api/export" download>Export</a>
  <button class="btn" id="importBtn">Import</button>
  <input type="file" id="importFile" accept="application/json" hidden>
  <button class="btn" id="rebuild">Rebuild site</button>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div id="view"></div>
  </main>
</div>

<div class="savebar">
  <button class="btn primary" id="save">Save and rebuild</button>
  <button class="btn" id="revert">Discard changes</button>
  <span class="status" id="status">No changes</span>
</div>

<script>
"use strict";
var state = { id:null, data:null, clean:null, dirty:false, editing:null };

var el = function (t, cls, txt) {
  var n = document.createElement(t);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
function setStatus(msg, kind) {
  var s = document.getElementById("status");
  s.textContent = msg; s.className = "status" + (kind ? " " + kind : "");
}
function markDirty() { state.dirty = true; setStatus("Unsaved changes"); }

/* ---- label prettifier: keys are the schema, so make them readable ---- */
function pretty(k) {
  return String(k).replace(/_/g, " ")
    .replace(/\bpercent\b/, "%").replace(/^\w/, function (c) { return c.toUpperCase(); });
}
var LONG = /story|body|ingredients|intro|sub|description|headline/;

/* ---- recursive field renderer: whatever is in the JSON becomes editable ---- */
function field(key, value, parent, path) {
  /* boolean */
  if (typeof value === "boolean") {
    var lb = el("label", "bool");
    var cb = el("input"); cb.type = "checkbox"; cb.checked = value;
    cb.onchange = function () { parent[key] = cb.checked; markDirty(); };
    lb.appendChild(cb); lb.appendChild(el("span", null, pretty(key)));
    return lb;
  }
  /* number (null means "not recorded" and must stay null, not become 0) */
  if (typeof value === "number" || (value === null && /stock|price|order/.test(key))) {
    var l = el("label", "f"); l.appendChild(el("span", null, pretty(key)));
    var i = el("input"); i.type = "number"; i.value = value === null ? "" : value;
    i.placeholder = value === null ? "not recorded" : "";
    i.oninput = function () { parent[key] = i.value === "" ? null : Number(i.value); markDirty(); };
    l.appendChild(i); return l;
  }
  /* string */
  if (typeof value === "string") {
    var l2 = el("label", "f"); l2.appendChild(el("span", null, pretty(key)));
    var inp = LONG.test(key) || value.length > 70 ? el("textarea") : el("input");
    if (inp.tagName === "INPUT") inp.type = "text";
    inp.value = value;
    inp.oninput = function () { parent[key] = inp.value; markDirty(); };
    l2.appendChild(inp); return l2;
  }
  /* array */
  if (Array.isArray(value)) {
    var fs = el("fieldset"); fs.appendChild(el("legend", null, pretty(key)));
    var host = el("div");
    function draw() {
      host.innerHTML = "";
      value.forEach(function (v, i) {
        var wrap = el("div", "item");
        var head = el("div", "row");
        head.appendChild(el("span", "idx", "#" + (i + 1)));
        head.appendChild(el("span", null, ""));
        var sp = el("span"); sp.style.flex = "1"; head.appendChild(sp);
        var up = el("button", "btn", "↑"); up.type = "button";
        up.onclick = function () { if (i) { value.splice(i-1,0,value.splice(i,1)[0]); markDirty(); draw(); } };
        var dn = el("button", "btn", "↓"); dn.type = "button";
        dn.onclick = function () { if (i<value.length-1) { value.splice(i+1,0,value.splice(i,1)[0]); markDirty(); draw(); } };
        var rm = el("button", "btn danger", "Remove"); rm.type = "button";
        rm.onclick = function () { value.splice(i,1); markDirty(); draw(); };
        head.appendChild(up); head.appendChild(dn); head.appendChild(rm);
        wrap.appendChild(head);
        if (v !== null && typeof v === "object") {
          Object.keys(v).forEach(function (k2) { wrap.appendChild(field(k2, v[k2], v, path+"."+i)); });
        } else {
          wrap.appendChild(field(String(i), v, value, path+"."+i));
        }
        host.appendChild(wrap);
      });
      var add = el("button", "btn", "Add");
      add.type = "button";
      add.onclick = function () {
        var last = value[value.length - 1];
        if (last && typeof last === "object") {
          var blank = {}; Object.keys(last).forEach(function (k3) {
            blank[k3] = typeof last[k3] === "number" ? 0
                      : typeof last[k3] === "boolean" ? false
                      : Array.isArray(last[k3]) ? [] : "";
          });
          value.push(blank);
        } else { value.push(""); }
        markDirty(); draw();
      };
      host.appendChild(add);
    }
    draw(); fs.appendChild(host); return fs;
  }
  /* object */
  if (value !== null && typeof value === "object") {
    var fs2 = el("fieldset"); fs2.appendChild(el("legend", null, pretty(key)));
    Object.keys(value).forEach(function (k4) {
      fs2.appendChild(field(k4, value[k4], value, path+"."+k4));
    });
    return fs2;
  }
  /* null of unknown type: treat as free text so it is still editable */
  var l3 = el("label", "f"); l3.appendChild(el("span", null, pretty(key) + " (empty)"));
  var t3 = el("input"); t3.type = "text"; t3.value = "";
  t3.oninput = function () { parent[key] = t3.value; markDirty(); };
  l3.appendChild(t3); return l3;
}

/* ---- products get a list first, because 34 forms at once is unusable ---- */
function renderProducts(view) {
  if (state.editing) {
    var p = state.data[state.editing];
    var back = el("button", "btn", "← All products"); back.type = "button";
    back.onclick = function () { state.editing = null; render(); };
    view.appendChild(back);
    view.appendChild(el("h1", null, p.name || state.editing));
    var hint = el("p", "hint");
    hint.appendChild(document.createTextNode("Document id: " + state.editing +
      " · this is the product's URL and does not change when you rename it. "));
    var prev = el("a", null, "Preview on the storefront →");
    prev.href = "http://localhost:4310/product.html?p=" + state.editing;
    prev.target = "_blank"; prev.rel = "noopener";
    hint.appendChild(prev);
    view.appendChild(hint);

    if (p.images && p.images.length) view.appendChild(imageManager(p));

    /* fields are grouped; "in use" is what the site reads today, the rest are
       here ready for when they are needed */
    var GROUPS = [
      ["In use now", ["name","category","price","sizes","stock","gender","size",
                      "contents","published","never_discount","order"]],
      ["Scent and story", ["top","heart","base","story","ingredients","barcode"]],
      ["Taxonomy, not yet filled", ["family","tone","occasion","season",
                                    "longevity","sillage","badge"]],
      ["Arabic", ["name_ar","story_ar"]],
      ["Search engines", ["seo_title","seo_description","image_alt"]],
      ["Related products", ["related"]],
      ["Images", ["images"]]
    ];
    var placed = {};
    GROUPS.forEach(function (g, gi) {
      var keys = g[1].filter(function (k) { return k in p; });
      if (!keys.length) return;
      var d = el("details", "group"); if (gi === 0) d.open = true;
      d.appendChild(el("summary", null, g[0]));
      var inner = el("div", "inner");
      keys.forEach(function (k) { placed[k] = 1; inner.appendChild(field(k, p[k], p, k)); });
      d.appendChild(inner); view.appendChild(d);
    });
    var rest = Object.keys(p).filter(function (k) { return !placed[k]; });
    if (rest.length) {
      var d2 = el("details", "group");
      d2.appendChild(el("summary", null, "Other"));
      var in2 = el("div", "inner");
      rest.forEach(function (k) { in2.appendChild(field(k, p[k], p, k)); });
      d2.appendChild(in2); view.appendChild(d2);
    }

    var dup = el("button", "btn", "Duplicate"); dup.type = "button";
    dup.onclick = function () {
      var name = prompt("Name for the copy", p.name + " copy");
      if (!name) return;
      var id = name.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      if (state.data[id]) { alert("A product with that id already exists."); return; }
      var copy = JSON.parse(JSON.stringify(p));
      copy.name = name; copy.published = false; copy.images = [];
      copy.order = Math.max.apply(null, [0].concat(Object.keys(state.data).map(function (k) {
        return state.data[k].order || 0; }))) + 1;
      state.data[id] = copy; state.editing = id; markDirty(); render();
    };
    view.appendChild(dup);
    var del = el("button", "btn danger", "Delete this product"); del.type = "button";
    del.onclick = function () {
      if (!confirm("Delete " + (p.name || state.editing) + "? Save is still required to apply it.")) return;
      delete state.data[state.editing]; state.editing = null; markDirty(); render();
    };
    view.appendChild(del);
    return;
  }
  view.appendChild(el("h1", null, "Products"));
  view.appendChild(el("p", "hint", Object.keys(state.data).length +
    " documents. Unpublished ones stay out of the site but keep their data."));

  var q = el("input", "search"); q.type = "text"; q.placeholder = "Filter by name or category…";
  view.appendChild(q);

  /* bulk actions: publishing a season of products one at a time is no fun */
  var sel = {};
  var bulk = el("div", "bulk");
  function refreshBulk() {
    var n = Object.keys(sel).filter(function (k) { return sel[k]; }).length;
    bulk.querySelector(".n").textContent = n ? n + " selected" : "Nothing selected";
    [].forEach.call(bulk.querySelectorAll("button"), function (b) { b.disabled = !n; });
  }
  function chosen() { return Object.keys(sel).filter(function (k) { return sel[k]; }); }
  bulk.appendChild(el("span", "n", "Nothing selected"));
  [["Publish", function (k) { state.data[k].published = true; }],
   ["Unpublish", function (k) { state.data[k].published = false; }]].forEach(function (a) {
    var b = el("button", "btn", a[0]); b.type = "button";
    b.onclick = function () { chosen().forEach(a[1]); markDirty(); render(); };
    bulk.appendChild(b);
  });
  var pc = el("button", "btn", "Adjust price %"); pc.type = "button";
  pc.onclick = function () {
    var v = prompt("Change price by what percent? (e.g. 10 or -5)");
    if (v === null || v === "") return;
    var f = 1 + Number(v) / 100;
    if (!isFinite(f)) return alert("Not a number.");
    chosen().forEach(function (k) {
      state.data[k].price = Math.round((state.data[k].price || 0) * f);
      (state.data[k].sizes || []).forEach(function (z) { z.price = Math.round(z.price * f); });
    });
    markDirty(); render();
  };
  bulk.appendChild(pc);
  view.appendChild(bulk);

  var list = el("div", "list"); view.appendChild(list);

  function draw() {
    list.innerHTML = "";
    var term = q.value.toLowerCase();
    Object.keys(state.data)
      .sort(function (a, b) { return (state.data[a].order||0) - (state.data[b].order||0); })
      .filter(function (k) {
        var p = state.data[k];
        return !term || (p.name + " " + p.category + " " + k).toLowerCase().indexOf(term) > -1;
      })
      .forEach(function (k) {
        var p = state.data[k];
        var a = el("a");
        var left = el("span", "row");
        var cb = el("input"); cb.type = "checkbox"; cb.checked = !!sel[k];
        cb.onclick = function (ev) { ev.stopPropagation(); sel[k] = cb.checked; refreshBulk(); };
        left.appendChild(cb);
        left.appendChild(el("span", null, p.name || k));
        var right = el("span", "row");
        right.appendChild(el("span", "meta", "AED " + p.price));
        right.appendChild(el("span", "tag", p.category));
        if (p.published === false) right.appendChild(el("span", "tag off", "unpublished"));
        a.appendChild(left); a.appendChild(right);
        a.onclick = function () { state.editing = k; render(); };
        list.appendChild(a);
      });
  }
  q.oninput = draw; draw(); refreshBulk();

  var add = el("button", "btn", "Add a product"); add.type = "button";
  add.onclick = function () {
    var name = prompt("Product name");
    if (!name) return;
    var id = name.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    if (state.data[id]) { alert("A product with that id already exists."); return; }
    var maxOrder = Math.max.apply(null, [0].concat(Object.keys(state.data).map(function (k) {
      return state.data[k].order || 0; })));
    state.data[id] = { name:name, category:"oud-oils", price:0, stock:null,
                       story:[], never_discount:false, published:false, order:maxOrder + 1 };
    state.editing = id; markDirty(); render();
  };
  view.appendChild(add);
}

function render() {
  var view = document.getElementById("view");
  view.innerHTML = "";
  if (!state.data) { view.appendChild(el("p", "hint", "Loading…")); return; }
  if (state.id === "products") return renderProducts(view);

  var labels = { settings:"Store settings", navigation:"Navigation and footer",
                 copy:"Site copy", home:"Home page" };
  view.appendChild(el("h1", null, labels[state.id] || state.id));
  view.appendChild(el("p", "hint", "Every field here is written straight into the site on save."));
  Object.keys(state.data).forEach(function (k) {
    view.appendChild(field(k, state.data[k], state.data, k));
  });
}

function load(id) {
  state.id = id; state.editing = null; state.data = null;
  document.querySelectorAll("#nav button").forEach(function (b) {
    b.classList.toggle("on", b.dataset.id === id);
  });
  render();
  fetch("/api/content/" + id).then(function (r) { return r.json(); }).then(function (d) {
    state.data = d; state.clean = JSON.stringify(d); state.dirty = false;
    setStatus("No changes"); render();
  });
}

document.getElementById("save").onclick = function () {
  if (!state.data) return;
  setStatus("Saving…");
  fetch("/api/content/" + state.id, {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(state.data)
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (res.error) return setStatus("Not saved: " + res.error, "err");
    state.clean = JSON.stringify(state.data); state.dirty = false;
    setStatus(res.built ? "Saved and rebuilt. Reload the storefront to see it."
                        : "Saved, but the build failed: " + res.output, res.built ? "ok" : "err");
  }).catch(function (e) { setStatus("Not saved: " + e.message, "err"); });
};

document.getElementById("revert").onclick = function () {
  if (!state.clean) return;
  state.data = JSON.parse(state.clean); state.dirty = false;
  state.editing = null; setStatus("Changes discarded"); render();
};

document.getElementById("rebuild").onclick = function () {
  setStatus("Rebuilding…");
  fetch("/api/build", { method: "POST" }).then(function (r) { return r.json(); })
    .then(function (res) { setStatus(res.built ? "Rebuilt." : "Build failed: " + res.output,
                                     res.built ? "ok" : "err"); });
};

window.addEventListener("beforeunload", function (e) {
  if (state.dirty) { e.preventDefault(); e.returnValue = ""; }
});

/* ---- image manager: reorder, set primary, remove ---- */
function imageManager(p) {
  var fs = el("fieldset");
  fs.appendChild(el("legend", null, "Photographs"));
  var note = el("p", "hint", "The first image is the one used on cards and as the gallery's opening frame. Files live in assets/img/ and are produced by tools/import_images.py.");
  note.style.margin = "0 0 8px";
  fs.appendChild(note);
  var strip = el("div", "imgstrip");
  function draw() {
    strip.innerHTML = "";
    p.images.forEach(function (name, i) {
      var c = el("div", "imgcard" + (i === 0 ? " primary" : ""));
      var im = el("img"); im.src = "http://localhost:4310/assets/img/" + name; im.alt = "";
      c.appendChild(im);
      c.appendChild(el("div", "nm", i === 0 ? "primary" : "#" + (i + 1)));
      var row = el("div", "row");
      var L = el("button", "btn", "←"); L.type = "button";
      L.onclick = function () { if (i) { p.images.splice(i-1,0,p.images.splice(i,1)[0]); markDirty(); draw(); } };
      var R = el("button", "btn", "→"); R.type = "button";
      R.onclick = function () { if (i<p.images.length-1) { p.images.splice(i+1,0,p.images.splice(i,1)[0]); markDirty(); draw(); } };
      var X = el("button", "btn danger", "×"); X.type = "button";
      X.onclick = function () { p.images.splice(i,1); markDirty(); draw(); };
      row.appendChild(L); row.appendChild(R); row.appendChild(X);
      c.appendChild(row); strip.appendChild(c);
    });
  }
  draw(); fs.appendChild(strip); return fs;
}

/* ---- slide-over panel ---- */
function panel(title, build) {
  var old = document.querySelector(".panel"); if (old) old.remove();
  var p = el("div", "panel");
  var head = el("div", "row"); head.style.marginBottom = "10px";
  head.appendChild(el("h2", null, title));
  var sp = el("span"); sp.style.flex = "1"; head.appendChild(sp);
  var x = el("button", "btn", "Close"); x.type = "button";
  x.onclick = function () { p.remove(); };
  head.appendChild(x); p.appendChild(head);
  build(p);
  document.body.appendChild(p);
}

document.getElementById("history").onclick = function () {
  panel("History — " + state.id, function (p) {
    p.appendChild(el("p", "hint", "Every save is kept. Restoring writes that version back and rebuilds."));
    fetch("/api/backups/" + state.id).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.backups.length) { p.appendChild(el("p", "hint", "No earlier versions yet.")); return; }
      d.backups.forEach(function (b) {
        var row = el("div", "v");
        var t = b.stamp.replace(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})$/,
                                "$1-$2-$3 $4:$5:$6");
        row.appendChild(el("code", null, t + "  ·  " + Math.round(b.bytes/1024) + " KB"));
        var r2 = el("button", "btn", "Restore"); r2.type = "button";
        r2.onclick = function () {
          if (!confirm("Restore the version from " + t + "?")) return;
          fetch("/api/restore", { method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ collection: state.id, file: b.file }) })
            .then(function (r3) { return r3.json(); }).then(function (res) {
              if (res.error) return setStatus(res.error, "err");
              state.data = res.data; state.clean = JSON.stringify(res.data);
              state.dirty = false; state.editing = null;
              setStatus("Restored " + t, "ok"); render();
              document.querySelector(".panel").remove();
            });
        };
        row.appendChild(r2); p.appendChild(row);
      });
    });
  });
};

document.getElementById("importBtn").onclick = function () {
  document.getElementById("importFile").click();
};
document.getElementById("importFile").onchange = function (e) {
  var f = e.target.files[0]; if (!f) return;
  if (!confirm("Import " + f.name + "? This replaces every collection it contains.")) return;
  f.text().then(function (t) {
    var bundle; try { bundle = JSON.parse(t); }
    catch (err) { return setStatus("Not valid JSON: " + err.message, "err"); }
    return fetch("/api/import", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(bundle) }).then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.error) return setStatus(res.error, "err");
        setStatus("Imported: " + res.imported.join(", "), "ok");
        load(state.id);
      });
  });
  e.target.value = "";
};

fetch("/api/collections").then(function (r) { return r.json(); }).then(function (d) {
  var nav = document.getElementById("nav");
  d.collections.forEach(function (c) {
    var b = el("button", null, c.label);
    b.type = "button"; b.dataset.id = c.id;
    b.onclick = function () {
      if (state.dirty && !confirm("You have unsaved changes. Leave them?")) return;
      load(c.id);
    };
    nav.appendChild(b);
  });
  load("products");
});
</script>
