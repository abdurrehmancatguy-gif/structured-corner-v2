# Publish the storefront to GitHub Pages.
#
# Pages' "deploy from a branch" option can only serve the repository root or
# /docs, and the site lives in flow/. This workflow uploads flow/ as the Pages
# artifact instead, so nothing has to be moved or duplicated, and Netlify keeps
# deploying from the same commit unchanged.
#
# build.py generates the HTML locally and the output is committed. This
# workflow rebuilds it and fails if the result differs, so a forgotten rebuild
# never ships, then publishes the HTML, favicon.ico, robots.txt, sw.js (the
# cache worker, which has to sit at the root to hold the whole site in scope)
# and assets/, less the stylesheet source. The generator, content and tools
# stay out of it.
# assets/ still holds the few original images the tools resize (logos,
# category photos), which nothing links to.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check the committed pages match a fresh build
        run: |
          cd flow && python3 build.py
          # git status, not git diff: a generated file nobody committed counts too.
          # Captured first, so a git that fails stops here instead of testing empty.
          s=$(git status --porcelain -- .)
          test -z "$s" || { echo "$s"; echo "flow/ is stale: run build.py and commit its output"; exit 1; }

      - name: Stage only what the site serves
        run: |
          rm -rf _site && mkdir _site
          cp flow/*.html flow/favicon.ico flow/robots.txt flow/sw.js _site/
          cp -R flow/assets _site/assets
          rm -f _site/assets/cat/SOURCES.txt _site/assets/flow.css

      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
