# The storefront lives in flow/, not at the repository root, so Netlify has to
# be told where to publish from. Without this it serves the root — which has no
# index.html — and every path returns 404.
[build]
  publish = "flow"
  command = ""

# Static pages, generated by flow/build.py. No build step runs on Netlify.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
