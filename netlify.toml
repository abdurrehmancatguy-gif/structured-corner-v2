# The storefront lives in flow/, not at the repository root, so Netlify has to
# be told where to publish from. Without this it serves the root - which has no
# index.html - and every path returns 404.
[build]
  publish = "_site"
  command = 'cd flow && python3 build.py && (test -z "$(git status --porcelain -- .)" || { git status --porcelain -- .; echo "flow/ is stale: run build.py and commit its output"; exit 1; }) && cd .. && rm -rf _site && mkdir _site && cp flow/*.html flow/favicon.ico flow/robots.txt _site/ && cp -R flow/assets _site/assets && rm -f _site/assets/cat/SOURCES.txt'

[build.environment]
  PYTHON_VERSION = "3.12"

# Static pages, generated by flow/build.py and committed. Netlify first rebuilds
# them and stops if anything differs from the commit (the same guard as the
# GitHub Pages workflow), then copies only what the pages use (the HTML,
# favicon.ico, robots.txt and assets/) into _site, so the generator, content
# and tools are not published. The build is byte-identical under Python 3.9,
# 3.12 and 3.13.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
