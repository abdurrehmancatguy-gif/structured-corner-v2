# Netlify runs nothing: the owner asked for no build here, and build.py's
# output is committed, so a deploy is the repository as it stands. That is why
# the repository ROOT is published and not flow/: the root carries _redirects,
# which refuses the generator, the content, the tools and the stylesheet
# sources with a 404 and rewrites everything else into flow/. Publishing flow/
# itself would serve build.py, content/ and tools/ to anyone who asked.
#
# Nothing here checks that the committed pages match a fresh build, which the
# build command used to do and the GitHub Pages workflow still does. Run
# build.py before pushing, or Netlify serves whatever was committed.
[build]
  publish = "."
  # Only the test site deploys. Netlify cancels a build whose ignore command
  # exits 0, so every other site connected to this repository (the first
  # Netlify address) is skipped and goes on showing what it already has.
  ignore = "test \"$SITE_NAME\" != corner-database-test"

# To build here again, put back the publish directory and the command:
#   publish = "_site"
#   command = 'cd flow && python3 build.py && s=$(git status --porcelain -- .) && { test -z "$s" || { echo "$s"; echo "flow/ is stale: run build.py and commit its output"; exit 1; }; } && cd .. && rm -rf _site && mkdir _site && cp flow/*.html flow/favicon.ico flow/robots.txt flow/sw.js _site/ && cp -R flow/assets _site/assets && rm -f _site/assets/cat/SOURCES.txt _site/assets/flow.css'
#   [build.environment] PYTHON_VERSION = "3.12"
# It rebuilds the pages, stops if anything differs from the commit (the same
# guard as the GitHub Pages workflow), then stages only what the site serves.
# The build is byte-identical under Python 3.9, 3.12 and 3.13.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# The cache worker itself. It is asked for again on every visit (shop.js
# registers it with updateViaCache "none"), and a copy kept for a year would
# leave a mistake in it in place, so it is never cached.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
