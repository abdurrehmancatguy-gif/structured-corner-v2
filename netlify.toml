# The storefront lives in flow/, not at the repository root, so Netlify has to
# be told where to publish from. Without this it serves the root - which has no
# index.html - and every path returns 404.
[build]
  publish = "_site"
  command = "rm -rf _site && mkdir _site && cp flow/*.html flow/favicon.ico flow/robots.txt _site/ && cp -R flow/assets _site/assets && rm -f _site/assets/cat/SOURCES.txt"

# Static pages, generated by flow/build.py and committed. Netlify only copies
# what the pages use (the HTML, favicon.ico, robots.txt and assets/) into
# _site, so the generator, content and tools are not published.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
